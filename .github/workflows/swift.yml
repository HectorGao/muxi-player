name: macOS app
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve preview version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install fixture encoder
        run: |
          brew install ffmpeg
      - name: Fetch verified runtime and complete corresponding sources
        run: |
          python3 script/prepare_release_runtime.py --self-test
          python3 script/prepare_release_runtime.py
          echo "MUXI_MPV_LIB_DIR=$GITHUB_WORKSPACE/.local/release-materials/runtime" >> "$GITHUB_ENV"
      - name: Test Emby protocol and playback requests
        run: ./script/test.sh
      - name: Check loopback media fixture
        run: python3 script/smoke_server.py --self-test
      - name: Build and verify Apple Silicon app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(uname -m)" = arm64
          ./script/build_and_run.sh --build-only --version "$RELEASE_VERSION" --build-number "$GITHUB_RUN_NUMBER" --output "$PWD/dist/MuxiPlayer.app"
      - name: Package app, sources and checksums
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 script/package_release.py --version "$RELEASE_VERSION" --app-bundle dist/MuxiPlayer.app --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: MuxiPlayer-${{ steps.version.outputs.value }}-macOS-arm64
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MuxiPlayer-${{ needs.build-and-test.outputs.version }}-macOS-arm64
          path: release
      - name: Publish new preview without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Existing release preserved, including any locally tested app. CI assets remain in this run."
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "幕汐 $RELEASE_TAG" --notes "Apple Silicon · macOS 14+。此预览版采用 ad-hoc 签名，未经 Apple 公证。APP、对应项目源码、完整依赖源码及 SHA256SUMS 同时提供。"
          fi
